name: CI

# Um workflow: check em todo push/PR; migrate só após check verde (push ou manual).
on:
  push:
    branches: [staging, production]
  pull_request:
    branches: [staging, production]
  workflow_dispatch:
    inputs:
      environment:
        description: "Rodar migrate manual (além do check)"
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  changes:
    name: Database paths changed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            database:
              - "prisma/**"
              - "scripts/db-preflight.mjs"
              - ".github/workflows/ci.yml"

  deploy-staging:
    name: Migrate (staging)
    needs: [check, changes]
    if: |
      always() &&
      needs.check.result == 'success' &&
      github.event_name != 'pull_request' &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.database == 'true') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/staging')
      )
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
      DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Apply migrations (staging)
        run: npm run db:deploy

  deploy-production:
    name: Migrate (production)
    needs: [check, changes]
    if: |
      always() &&
      needs.check.result == 'success' &&
      github.event_name != 'pull_request' &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.database == 'true') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/production')
      )
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
      DIRECT_URL: ${{ secrets.DIRECT_URL_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Apply migrations (production)
        run: npm run db:deploy

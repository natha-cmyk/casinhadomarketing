<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casinha do Marketing — Seahub</title>
<style>
  :root{
    --red:#FF001E; --cyan:#00BBC5; --ink:#121111;
    --bg:#FFFFFF; --surface:#F5F5F7; --surface-2:#EDEDEC;
    --hairline:rgba(0,0,0,.09); --hairline-2:rgba(0,0,0,.14);
    --label:#1D1D1F; --label-2:#6E6E73; --label-3:#9A9AA0;
    --excelente:#2FB457; --bom:#00BBC5; --atencao:#FF9F0A; --critico:#FF001E;
    --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 1px 8px rgba(0,0,0,.03);
    --shadow-pop:0 4px 24px rgba(0,0,0,.10);
    --r-lg:14px; --r-md:10px; --r-sm:7px; --sidebar-w:248px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);color:var(--label);background:var(--surface);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-size:14px;line-height:1.45;overflow:hidden}
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  button{font-family:inherit} a{color:inherit}
  .app{display:flex;height:100dvh;width:100%}
  .sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--surface);border-right:1px solid var(--hairline);display:flex;flex-direction:column}
  .sb-top{padding:14px 16px 8px}
  .traffic{display:flex;gap:8px;margin-bottom:16px}
  .traffic i{width:12px;height:12px;border-radius:50%;display:block}
  .traffic i:nth-child(1){background:var(--red)} .traffic i:nth-child(2){background:#FEBC2E} .traffic i:nth-child(3){background:#28C840}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:34px;height:34px;border-radius:9px;flex:0 0 34px;background:linear-gradient(150deg,var(--red),#c60018);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 2px 6px rgba(255,0,30,.28);letter-spacing:-.5px}
  .brand h1{font-size:14.5px;font-weight:650;margin:0;letter-spacing:-.2px;line-height:1.15}
  .brand p{font-size:11.5px;color:var(--label-2);margin:1px 0 0}
  .search{padding:6px 12px 10px}
  .search .field{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.05);border-radius:8px;padding:6px 9px;border:1px solid transparent;transition:.15s}
  .search .field:focus-within{background:#fff;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,187,197,.16)}
  .search svg{width:14px;height:14px;color:var(--label-3);flex:0 0 auto}
  .search input{border:0;background:transparent;outline:0;font-size:13px;width:100%;color:var(--label)}
  .nav{flex:1;overflow-y:auto;padding:2px 10px 16px}
  .nav-group{margin-top:14px}
  .nav-group h2{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--label-3);margin:0 0 4px;padding:0 8px}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:7px;border:0;background:transparent;cursor:pointer;color:var(--label);font-size:13.5px;font-weight:450;transition:background .12s}
  .nav-item:hover{background:rgba(0,0,0,.045)}
  .nav-item .ico{width:20px;height:20px;flex:0 0 20px;display:grid;place-items:center;color:var(--label-2)}
  .nav-item .ico svg{width:17px;height:17px}
  .nav-item.active{background:rgba(0,0,0,.065);font-weight:550}
  .nav-item.active .ico{color:var(--red)}
  .nav-item .tag{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--label-3);background:rgba(0,0,0,.06);padding:2px 6px;border-radius:20px}
  .nav-item.live .tag{color:#0a8a91;background:rgba(0,187,197,.15)}
  .sb-foot{padding:10px 16px;border-top:1px solid var(--hairline);font-size:11px;color:var(--label-3);display:flex;align-items:center;gap:8px}
  .sb-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--excelente)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .toolbar{min-height:52px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 22px;border-bottom:1px solid var(--hairline);background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(18px);position:relative;z-index:5;flex-wrap:wrap}
  .menu-btn{display:none}
  .tb-title{font-size:15px;font-weight:640;letter-spacing:-.2px;margin-right:auto}
  .tb-title small{color:var(--label-3);font-weight:500;margin-left:8px;font-size:12px}
  .seg{display:inline-flex;background:rgba(0,0,0,.06);border-radius:9px;padding:2px}
  .seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--label-2);cursor:pointer;transition:.12s;white-space:nowrap}
  .seg button.on{background:#fff;color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
  .seg.small{padding:2px} .seg.small button{padding:4px 9px;font-size:11.5px}
  .tb-select{border:1px solid var(--hairline-2);background:#fff;border-radius:8px;padding:5px 8px;font-size:12.5px;font-weight:600;color:var(--label);cursor:pointer}
  .tb-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hairline-2);background:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--label-2);cursor:pointer;transition:.12s}
  .tb-toggle.on{background:rgba(0,187,197,.12);border-color:transparent;color:#0a8a91}
  .tb-toggle svg{width:14px;height:14px}
  .updated{font-size:11.5px;color:var(--label-3);white-space:nowrap}
  .scnbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 22px;border-bottom:1px solid var(--hairline);background:rgba(0,187,197,.06);flex-wrap:wrap;font-size:12.5px}
  .scnbar b{color:#0a8a91;font-weight:650}

  .content{flex:1;overflow-y:auto;padding:26px 28px 60px}
  .view{max-width:1080px;margin:0 auto;animation:rise .28s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .page-head{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .page-head .eyebrow{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--red)}
  .page-head h2{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:3px 0 4px}
  .page-head p{color:var(--label-2);margin:0;font-size:13.5px;max-width:64ch}
  .btn-link{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hairline-2);background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--label);cursor:pointer;text-decoration:none;white-space:nowrap;transition:.12s}
  .btn-link:hover{background:var(--surface)} .btn-link svg{width:16px;height:16px}
  .btn-link.ig{border-color:transparent;background:linear-gradient(120deg,#FF001E,#C13584 60%,#833AB4);color:#fff}

  .grid{display:grid;gap:16px}
  .card{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:18px 20px}
  .card.pad-lg{padding:22px 24px}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
  .card-head .t{font-size:14.5px;font-weight:640;letter-spacing:-.1px}
  .card-head .sub{font-size:12px;color:var(--label-3);margin-top:1px}
  .card-head .badge{font-size:11px;font-weight:650;padding:3px 9px;border-radius:20px;background:rgba(0,187,197,.14);color:#0a8a91}

  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi .lbl{font-size:12.5px;color:var(--label-2);font-weight:500}
  .kpi .val{font-size:25px;font-weight:700;letter-spacing:-.6px;margin:5px 0 6px;line-height:1}
  .kpi .cmp{display:flex;flex-direction:column;gap:3px;margin-top:2px}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
  .chip.up{color:#0f7a37;background:rgba(47,180,87,.14)} .chip.down{color:#c60018;background:rgba(255,0,30,.11)} .chip.flat{color:var(--label-2);background:rgba(0,0,0,.06)}
  .chip.scn{color:#0a8a91;background:rgba(0,187,197,.14)}
  .cmp .row{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--label-3)}
  .kpi .foot{font-size:11.5px;color:var(--label-3);margin-top:7px}

  .bar-row{display:grid;grid-template-columns:132px 1fr 62px;align-items:center;gap:12px;padding:7px 0}
  .bar-row + .bar-row{border-top:1px solid var(--hairline)}
  .bar-row .k{font-size:13px;color:var(--label);font-weight:500}
  .bar-track{height:9px;background:rgba(0,0,0,.06);border-radius:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:20px}
  .bar-row .v{text-align:right;font-size:13px;font-weight:640}

  .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .mini .m{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);padding:11px 13px}
  .mini .m .l{font-size:11.5px;color:var(--label-2)} .mini .m .n{font-size:18px;font-weight:700;margin-top:3px}

  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--label-2)}
  .legend i{width:10px;height:10px;border-radius:3px;display:block}
  .legend i.dash{width:14px;height:0;border-top:2px dashed var(--label-3);border-radius:0}
  .legend i.dash.scn{border-color:#00BBC5}

  .pie-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .pie-legend{display:flex;flex-direction:column;gap:7px;min-width:170px;flex:1}
  .pie-legend .pl{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .pie-legend .pl i{width:11px;height:11px;border-radius:3px;flex:0 0 11px}
  .pie-legend .pl b{margin-left:auto;font-weight:640}
  .pie-legend .pl span{color:var(--label-3);font-size:11.5px;min-width:40px;text-align:right}

  .tbl-scroll{overflow-x:auto;margin:0 -20px;padding:0 20px}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
  table.data th{text-align:right;font-weight:600;color:var(--label-2);font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--hairline-2);white-space:nowrap;position:sticky;top:0;background:#fff}
  table.data th:first-child,table.data td:first-child{text-align:left}
  table.data td{padding:9px 10px;border-bottom:1px solid var(--hairline);text-align:right;white-space:nowrap}
  table.data tr:last-child td{border-bottom:0}
  table.data tr:hover td{background:rgba(0,0,0,.02)}
  table.data.ads-grid{min-width:820px} table.data.metas-grid{min-width:720px}
  th.stick,td.stick{position:sticky;left:0;background:#fff;z-index:2;min-width:158px;box-shadow:1px 0 0 var(--hairline)}
  th.stick{z-index:3} table.data tr:hover td.stick{background:#fbfbfc}
  .cell-edit{width:82px;max-width:82px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;font:inherit;text-align:right;color:var(--label);font-variant-numeric:tabular-nums;transition:.12s}
  .cell-edit:hover{background:rgba(0,0,0,.045)}
  .cell-edit:focus{background:#fff;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,187,197,.18);outline:none}
  .cell-edit.meta{font-weight:700}
  .canal-cell{display:flex;flex-direction:column;gap:1px}
  .canal-cell b{font-weight:600;font-size:13px} .canal-cell span{font-size:11px;color:var(--label-3)}
  .pill{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:20px}
  .pill.exc{color:#0f7a37;background:rgba(47,180,87,.14)} .pill.bom{color:#0a8a91;background:rgba(0,187,197,.14)}
  .pill.ate{color:#a6650a;background:rgba(255,159,10,.16)} .pill.cri{color:#c60018;background:rgba(255,0,30,.11)}
  .tfoot-note{font-size:11.5px;color:var(--label-3);margin-top:12px;display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap}

  .insight{display:flex;gap:11px;padding:13px 15px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--hairline)}
  .insight .ib{width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:grid;place-items:center;color:#fff}
  .insight .ib svg{width:15px;height:15px}
  .insight p{margin:0;font-size:12.5px;color:var(--label);line-height:1.5} .insight p b{font-weight:640}

  .scaffold-hero{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
  .scaffold-hero .icon{width:46px;height:46px;border-radius:12px;flex:0 0 46px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--hairline);color:var(--red)}
  .scaffold-hero .icon svg{width:24px;height:24px}
  .soon{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#a6650a;background:rgba(255,159,10,.16);padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:8px}
  .struct-list{list-style:none;padding:0;margin:0}
  .struct-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hairline);font-size:13px}
  .struct-list li:last-child{border-bottom:0}
  .struct-list .d{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex:0 0 6px}
  .struct-list li span.meta{margin-left:auto;font-size:11.5px;color:var(--label-3)}
  .two-col{grid-template-columns:1fr 1fr}
  .chips-inline{display:flex;flex-wrap:wrap;gap:7px}
  .chips-inline b{font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--hairline);padding:4px 10px;border-radius:20px;color:var(--label)}

  .drop{border:1.5px dashed var(--hairline-2);border-radius:var(--r-md);padding:24px;text-align:center;transition:.15s;cursor:pointer;background:var(--surface)}
  .drop.over{border-color:var(--cyan);background:rgba(0,187,197,.06)}
  .drop .di{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--hairline);display:grid;place-items:center;margin:0 auto 12px;color:var(--red)}
  .drop .di svg{width:22px;height:22px}
  .drop h4{margin:0 0 4px;font-size:14px;font-weight:640} .drop p{margin:0;font-size:12.5px;color:var(--label-2)}
  .file-chip{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);padding:11px 13px}
  .file-chip .fi{width:30px;height:30px;border-radius:7px;background:rgba(255,0,30,.1);display:grid;place-items:center;color:var(--red);flex:0 0 30px;font-size:11px;font-weight:700}
  .file-chip b{font-size:13px} .file-chip span{font-size:11.5px;color:var(--label-3)}
  .file-chip .x{margin-left:auto;border:0;background:transparent;color:var(--label-3);cursor:pointer;font-size:16px}
  .field-edit{width:100%;border:1px solid var(--hairline-2);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;color:var(--label);background:#fff}
  .field-edit:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,187,197,.16)}
  .field-lbl{font-size:12px;font-weight:600;color:var(--label-2);margin:0 0 6px;display:block}
  /* Calendário de conteúdo */
  .cc-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .cc-nav{display:flex;align-items:center;gap:8px}
  .cc-nav b{font-size:14px;font-weight:680;min-width:132px;text-align:center}
  .cc-nav button{width:30px;height:30px;border:1px solid var(--hairline-2);background:#fff;border-radius:8px;cursor:pointer;font-size:16px;color:var(--label);line-height:1}
  .cc-nav button:hover{background:var(--surface)}
  .cc-seg{display:inline-flex;background:var(--surface);border:1px solid var(--hairline);border-radius:9px;padding:2px;gap:2px}
  .cc-seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--label-2);cursor:pointer}
  .cc-seg button.on{background:#fff;color:var(--label);box-shadow:var(--shadow-card)}
  .cc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cc-h{font-size:11px;font-weight:700;color:var(--label-3);text-transform:uppercase;letter-spacing:.03em;text-align:center;padding:2px 0}
  .cc-cell{min-height:104px;border:1px solid var(--hairline);border-radius:10px;padding:6px;background:#fff;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:.1s}
  .cc-cell:hover{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,187,197,.10)}
  .cc-cell.cc-we{background:var(--surface)}
  .cc-cell.cc-empty{border:0;background:transparent;cursor:default;min-height:0}
  .cc-cell.cc-empty:hover{box-shadow:none}
  .cc-top{display:flex;align-items:center;gap:5px}
  .cc-dn{font-size:12.5px;font-weight:640;color:var(--label)}
  .cc-fer{font-size:9.5px;font-weight:700;text-transform:uppercase;color:#c60018;background:rgba(255,0,30,.10);padding:1px 5px;border-radius:5px}
  .cc-ev{font-size:9.5px;font-weight:700;color:#0a8a91;background:rgba(0,187,197,.14);padding:1px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px}
  .cc-add{margin-left:auto;color:var(--label-3);font-size:15px;font-weight:400;opacity:0;line-height:1}
  .cc-cell:hover .cc-add{opacity:1}
  .cc-posts{display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .post-chip{display:flex;align-items:center;gap:5px;border:1px solid var(--hairline);background:#fff;border-radius:6px;padding:3px 6px;cursor:pointer;text-align:left;width:100%;font:inherit}
  .post-chip.pub{background:var(--surface);opacity:.82}
  .post-chip:hover{border-color:var(--label-3)}
  .pc-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .pc-h{font-size:10px;font-weight:700;color:var(--label-3);flex:0 0 auto}
  .pc-t{font-size:11px;font-weight:560;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cc-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--hairline)}
  .cc-lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--label-2)}
  .pm-back{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .pm{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:min(560px,100%)}
  .pm-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--hairline)}
  .pm-head b{font-size:16px;font-weight:700}
  .pm-x{width:28px;height:28px;border:0;background:var(--surface);border-radius:50%;cursor:pointer;font-size:13px;color:var(--label-2)}
  .pm-body{padding:14px 20px 16px;display:flex;flex-direction:column;gap:2px}
  .pm-body .field-lbl{margin-top:9px}
  .pm-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pm-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--hairline);gap:8px}
  .pm-del{color:#c60018;border-color:rgba(255,0,30,.3)}
  .conta-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .conta-lbl{font-size:13px;font-weight:650;color:var(--label);display:flex;align-items:center;gap:8px}
  .conta-list{display:flex;gap:8px;flex-wrap:wrap}
  .conta{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hairline);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;color:var(--label-2)}
  .conta.on{border-color:var(--cyan);background:rgba(0,187,197,.06)}
  .conta-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;display:inline-block}
  .conta-n{color:var(--label)}
  .conta-btn{border:0;background:transparent;color:var(--cyan);font-weight:700;font-size:11.5px;cursor:pointer;padding:0 0 0 2px}
  .conta.on .conta-btn{color:var(--label-3)}

/* ---- resolução de escopo temporal (instância selecionada) ---- */
function scopeLabelText(cfg=state){
  const {period,year,month,week,quarter}=cfg;
  if(period==='semana')return 'W'+(week+1)+' · '+weekRange(year,month,week)+' · '+MONTHS[month]+' '+year;
  if(period==='mes')return MONTHS_FULL[month]+' '+year;
  if(period==='trimestre')return 'Q'+(quarter+1)+' · '+year;
  return String(year);
}
/* valor escalar do escopo, a partir de monthly[12] + weekly getter(y,m,w) */
function scopeVal(monthly,wk,cfg){
  const {period,year,month,week,quarter}=cfg;
  if(period==='semana')return wk?wk(year,month,week):0;
  if(period==='mes')return monthly[month];
  if(period==='trimestre')return sum(monthly.slice(quarter*3,quarter*3+3));
  return sum(monthly);
}
/* comparativos automáticos (período anterior + ano anterior), adaptável */
function autoCompare(getMonthly,getWk,cfg){
  const {period,year,month,week,quarter}=cfg;
  const cur=scopeVal(getMonthly(year),getWk?(y,m,w)=>getWk(y,m,w):null,cfg);
  const rows=[];
  if(period==='semana'){
    let prev=null;
    if(week>0) prev=getWk(year,month,week-1);
    else if(month>0) prev=getWk(year,month-1,3);
    if(prev!=null&&prev>0) rows.push(['semana passada',cur,prev]);
    const ya=getWk(year-1,month,week); if(ya>0) rows.push(['mesma semana, ano passado',cur,ya]);
  }else if(period==='mes'){
    if(month>0) rows.push(['mês passado',cur,getMonthly(year)[month-1]]);
    const ya=getMonthly(year-1)[month]; if(ya>0) rows.push(['mesmo mês, ano passado',cur,ya]);
  }else if(period==='trimestre'){
    if(quarter>0) rows.push(['trimestre passado',cur,sum(getMonthly(year).slice((quarter-1)*3,quarter*3))]);
    const ya=sum(getMonthly(year-1).slice(quarter*3,quarter*3+3)); if(ya>0) rows.push(['mesmo trim., ano passado',cur,ya]);
  }else{
    const ya=sum(getMonthly(year-1)); if(ya>0) rows.push(['ano passado',cur,ya]);
  }
  return rows.filter(r=>r[2]!=null&&r[2]>0);
}
function cmpBlock(getMonthly,getWk){
  const rows=autoCompare(getMonthly,getWk,state);
  let scn='';
  if(state.scenario){ const c=scopeVal(getMonthly(state.year),getWk,state), b=scopeVal(getMonthly(state.cmp.year),getWk?(y,m,w)=>getWk(y,m,w):null,state.cmp);
    scn=`<div class="row">${deltaChip(c,b,'scn',true)} vs cenário</div>`; }
  if(!rows.length&&!scn) return '';
  return `<div class="cmp">${rows.map(([l,c,p])=>`<div class="row">${deltaChip(c,p,null,true)} ${l}</div>`).join('')}${scn}</div>`;
}
function deltaChip(cur,prev,cls,withNum){
  if(prev==null||prev===0||cur==null||isNaN(cur))return `<span class="chip flat">—</span>`;
  const d=(cur-prev)/prev,up=d>=0;
  let num='';
  if(withNum){const dv=Math.abs(cur-prev);num=` · ${up?'+':'−'}${dv>=10000?kfmt(dv):fmt(Math.round(dv))}`;}
  return `<span class="chip ${cls||(up?'up':'down')}">${up?'▲':'▼'} ${(Math.abs(d)*100).toLocaleString('pt-BR',{maximumFractionDigits:0})}%${num}</span>`;
}
/* série do gráfico p/ dashboards: rótulos + valores + índice destacado */
function chartSeries(getMonthly,getWk,cfg){
  const {period,year,month,week,quarter}=cfg;
  if(period==='semana')return{labels:['W1','W2','W3','W4'],values:[0,1,2,3].map(w=>getWk?getWk(year,month,w):0),sel:week};
  const m=getMonthly(year);
  if(period==='trimestre')return{labels:['Q1','Q2','Q3','Q4'],values:[0,1,2,3].map(q=>sum(m.slice(q*3,q*3+3))),sel:quarter};
  return{labels:MONTHS,values:m.slice(0,12),sel:period==='mes'?month:-1};
}

/* ===================== CHARTS ===================== */
function lineChart(labels,series,opts={}){
  const W=opts.w||720,H=opts.h||240,pl=44,pr=14,pt=16,pb=28,iw=W-pl-pr,ih=H-pt-pb;
  const all=series.flatMap(s=>s.data.filter(v=>v!=null)); const max=Math.max(1,...all)*1.12; const n=labels.length;
  const x=i=>n<=1?pl+iw/2:pl+(iw*i/(n-1)); const y=v=>pt+ih-(v/max*ih);
  const grid=[0,.25,.5,.75,1].map(t=>{const gy=pt+ih-(ih*t);return `<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="rgba(0,0,0,.06)"/><text x="${pl-8}" y="${gy+3.5}" text-anchor="end" font-size="10" fill="#9A9AA0">${kfmt(Math.round(max*t))}</text>`}).join('');
  const xlab=labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="${i===opts.sel?'#121111':'#6E6E73'}" font-weight="${i===opts.sel?700:400}">${l}</text>`).join('');
  const paths=series.map(s=>{
    const pts=s.data.map((v,i)=>[x(i),y(v||0)]); const d='M'+pts.map(p=>p.join(',')).join(' L');
    const dots=(n<=6&&!s.dash)?s.data.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v||0)}" r="${i===opts.sel?4.5:3}" fill="#fff" stroke="${s.color}" stroke-width="${i===opts.sel?3:2}"/>`).join(''):'';
    return `${s.fill&&!s.dash?`<path d="${d} L${x(n-1)},${pt+ih} L${x(0)},${pt+ih} Z" fill="${s.color}" opacity=".10"/>`:''}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?2:2.4}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 5" opacity=".7"':''}/>${dots}`;
  }).join('');
  const selMark=(opts.sel>=0&&series[0])?`<line x1="${x(opts.sel)}" y1="${pt}" x2="${x(opts.sel)}" y2="${pt+ih}" stroke="rgba(0,0,0,.14)" stroke-dasharray="3 3"/>`:'';
  const meta={type:'line',pl,pr,pt,pb,W,H,max,labels,series:series.map(s=>({name:s.name||'',color:s.color,values:s.data,dash:!!s.dash})),vfmt:opts.vfmt||'num'};
  const metaStr=JSON.stringify(meta).replace(/'/g,'&#39;');
  return `<svg class="chart chartI" viewBox="0 0 ${W} ${H}" role="img" data-meta='${metaStr}'>${grid}${selMark}${paths}${xlab}</svg>`;
}
function barChart(labels,values,color,opts={}){
  const W=opts.w||720,H=opts.h||220,pl=44,pr=14,pt=14,pb=34,iw=W-pl-pr,ih=H-pt-pb,n=values.length;
  const max=Math.max(1,...values)*1.14,bw=Math.min(46,iw/n*0.62),step=iw/n;
  const grid=[0,.5,1].map(t=>{const gy=pt+ih-(ih*t);return `<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="rgba(0,0,0,.06)"/><text x="${pl-8}" y="${gy+3.5}" text-anchor="end" font-size="10" fill="#9A9AA0">${kfmt(Math.round(max*t))}</text>`}).join('');
  const bars=values.map((v,i)=>{const cx=pl+step*i+step/2,bh=(v||0)/max*ih,by=pt+ih-bh;const c=Array.isArray(color)?color[i]:color;return `<rect x="${cx-bw/2}" y="${by}" width="${bw}" height="${Math.max(bh,1)}" rx="5" fill="${i===opts.sel?'#FF001E':c}"/><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6E6E73">${labels[i]}</text>`}).join('');
  const meta={type:'bar',pl,pr,pt,pb,W,H,max,step,labels,series:[{name:opts.name||'',color:Array.isArray(color)?'#121111':color,values}],vfmt:opts.vfmt||'num'};
  const metaStr=JSON.stringify(meta).replace(/'/g,'&#39;');
  return `<svg class="chart chartI" viewBox="0 0 ${W} ${H}" role="img" data-meta='${metaStr}'>${grid}${bars}</svg>`;
}
function pieChart(data,size=200){
  const r=size/2,cx=r,cy=r,inner=r*0.6,total=sum(data.map(d=>d.v))||1;let a0=-Math.PI/2;
  const arcs=data.filter(d=>d.v>0).map(d=>{const frac=d.v/total,a1=a0+frac*2*Math.PI;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const ix0=cx+inner*Math.cos(a1),iy0=cy+inner*Math.sin(a1),ix1=cx+inner*Math.cos(a0),iy1=cy+inner*Math.sin(a0);
    const large=frac>0.5?1:0;a0=a1;
    return `<path d="M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} L${ix0},${iy0} A${inner},${inner} 0 ${large} 0 ${ix1},${iy1} Z" fill="${d.color}" stroke="#fff" stroke-width="2"><title>${d.label}: ${fmt(d.v)} (${pct(d.v/total)})</title></path>`;}).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img">${arcs}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="23" font-weight="700" fill="#121111">${fmt(total)}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="10.5" fill="#6E6E73">leads</text></svg>`;
}

function parseCSV(text){
  const lines=String(text).replace(/\r/g,'').split('\n').filter(l=>l.trim().length);
  if(!lines.length) return {cols:[],rows:[],total:0};
  const sp=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){q=!q;}else if((c===','||c===';')&&!q){out.push(cur);cur='';}else cur+=c;}out.push(cur);return out.map(s=>s.trim().replace(/^"|"$/g,''));};
  const cols=sp(lines[0]);
  const rows=lines.slice(1,6).map(sp);
  return {cols,rows,total:lines.length-1};
}
function detectType(vals){
  const v=(vals||[]).filter(x=>x!==''&&x!=null);
  if(!v.length) return 'texto';
  if(v.every(x=>/^-?[\d.,]+%?$/.test(String(x).trim()))) return 'número';
  if(v.every(x=>/\d{1,4}[\/-]\d{1,2}/.test(String(x)))) return 'data';
  return 'texto';
}
function handleFonteFile(file){
  if(!file) return;
  const name=file.name||'arquivo', ext=(name.split('.').pop()||'').toLowerCase();
  if(ext==='csv'){
    const rd=new FileReader();
    rd.onload=()=>{ const p=parseCSV(rd.result);
      const campos=p.cols.map((nome,i)=>{const vals=p.rows.map(r=>r[i]);const tipo=detectType(vals);return {nome:(nome||('coluna '+(i+1))),tipo,usar:tipo==='número'};});
      state.fonteMap={nome:name,tipo:'csv',campos,rows:p.rows,total:p.total};
      render(true);
    };
    rd.readAsText(file);
  } else {
    state.fonteMap={nome:name,tipo:(ext||'arquivo'),pendente:true};
    render(true);
  }
}

  const fm=state.fonteMap; if(!fm) return;
  const checked=[...document.querySelectorAll('[data-fmfield]:checked')].map(c=>+c.dataset.fmfield);
  const fonte={id:'f'+Date.now(),nome:fm.nome,tipo:fm.tipo,linhas:fm.total||0,campos:(fm.campos||[]).length,usados:fm.pendente?0:checked.length,pendente:!!fm.pendente};

}

function postMatch(p){
  if(state.calCanal!=='todos'&&p.canal!==state.calCanal)return false;
  if(state.calPerfil!=='todos'&&p.perfil!==state.calPerfil&&p.colab!==state.calPerfil)return false;
  if(state.calCV!=='todos'&&p.status!==state.calCV)return false;
  return true;
}
function postChip(p){
  const st=POST_STATUS[p.status]||POST_STATUS.rascunho;
  const c=CANAL_POST_COLORS[p.canal]||'#8E8E93';
  const acc=(p.contas||[]).length?` → ${(p.contas||[]).length} conta(s)`:'';
  return `<button class="post-chip st-${p.status}" data-post="${p.id}" title="${esc(p.canal)} · ${esc(p.perfil)} · ${st.label}${acc}"><span class="pc-dot" style="background:${c}"></span><span class="pc-h">${p.hora||''}</span><span class="pc-t">${esc(p.titulo)}</span></button>`;
}
function contentMonthGrid(year,month){
  const first=new Date(year,month,1).getDay(), dim=daysInMonth(year,month);
  let cells='';
  for(let i=0;i<first;i++) cells+='<div class="cc-cell cc-empty"></div>';
  for(let d=1;d<=dim;d++){
    const key=calKey(year,month,d), fer=FERIADOS[key], ev=EVENTOS[key], dow=new Date(year,month,d).getDay();
    const dp=state.posts.filter(p=>p.y===year&&p.m===month&&p.d===d&&postMatch(p)).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
    const tag=ev?`<span class="cc-ev" title="${esc(ev)}">${esc(ev)}</span>`:(fer?`<span class="cc-fer" title="${esc(fer)}">feriado</span>`:'');
    cells+=`<div class="cc-cell ${dow===0||dow===6?'cc-we':''}" data-newpost="${year}-${month}-${d}"><div class="cc-top"><span class="cc-dn">${d}</span>${tag}<span class="cc-add">+</span></div><div class="cc-posts">${dp.map(postChip).join('')}</div></div>`;
  }
  const H=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="cc-h">${x}</div>`).join('');
  return `<div class="cc-grid">${H}${cells}</div>`;
}

function savePost(){
  const g=id=>{const el=document.getElementById(id);return el?String(el.value).trim():'';};
  const dp=g('pmData').split('/').map(s=>parseInt(s,10));
  const d=dp[0]||1, m=((dp[1]||state.month+1)-1), y=dp[2]||state.year;
  const contas=[...document.querySelectorAll('[data-pmconta]:checked')].map(c=>c.dataset.pmconta);
  const obj={hora:g('pmHora'),titulo:g('pmTitulo')||'(sem título)',canal:g('pmCanal'),formato:g('pmFormato'),perfil:g('pmPerfil'),colab:g('pmColab'),pilar:g('pmPilar'),funil:g('pmFunil'),arquivo:g('pmArquivo'),legenda:g('pmLegenda'),cta:g('pmCta'),hashtags:g('pmHash'),status:g('pmStatus'),contas:contas,y:y,m:m,d:d};
  const eid=g('pmId');
  if(eid){const p=state.posts.find(x=>x.id===eid);if(p)Object.assign(p,obj);}
  else{obj.id='p'+Date.now();state.posts.push(obj);}
  state.postModal=null; render(true);
}

// barra de cenário (delegação)
document.getElementById('scnbar').addEventListener('click',e=>{
  const seg=e.target.closest('[data-scn] button');if(!seg)return;
  const grp=seg.parentElement.dataset.scn;
  if(grp==='period')state.cmp.period=seg.dataset.p; if(grp==='year')state.cmp.year=+seg.dataset.y;
  render(true);
});
document.getElementById('scnbar').addEventListener('change',e=>{
  const sel=e.target.closest('[data-scn]');if(!sel||sel.tagName!=='SELECT')return;
  const k=sel.dataset.scn; state.cmp[k]=+sel.value; if(k==='month')state.cmp.quarter=quarterOf(state.cmp.month); render(true);
});

const viewEl=document.getElementById('view');
viewEl.addEventListener('click',e=>{
  const gv=e.target.closest('.go-view[data-view]');if(gv){state.view=gv.dataset.view;render();return;}
  if(e.target.closest('[data-impopen]')){state.impOpen=!state.impOpen;render(true);return;}
  const relB=e.target.closest('[data-rel]');if(relB){if(!state.perfil.relacao)state.perfil.relacao={};const k=relB.dataset.rel;if(state.perfil.relacao[k])delete state.perfil.relacao[k];else state.perfil.relacao[k]=1;render(true);return;}
  const cedB=e.target.closest('[data-compedit]');if(cedB){state.compEdit=cedB.dataset.compedit;render(true);return;}
  const cclB=e.target.closest('[data-compcancel]');if(cclB){state.compEdit=null;render(true);return;}
  const csvB=e.target.closest('[data-compsave]');if(csvB){const inp=document.getElementById('compIconInput');const v=inp?inp.value.trim():'';if(!state.compIcons)state.compIcons={};if(v){state.compIcons[csvB.dataset.compsave]=v;}else{delete state.compIcons[csvB.dataset.compsave];}state.compEdit=null;render(true);return;}
  const cplB=e.target.closest('[data-comppull]');if(cplB){if(!state.compIcons)state.compIcons={};state.compIcons[cplB.dataset.comppull]='IG:'+cplB.dataset.comppull;state.compEdit=null;render(true);return;}
  const pnavB=e.target.closest('[data-pnav]');if(pnavB){const N=5;state.personaIdx=(((state.personaIdx||0)+(+pnavB.dataset.pnav))%N+N)%N;render(true);return;}
  const pgoB=e.target.closest('[data-pgo]');if(pgoB){state.personaIdx=+pgoB.dataset.pgo;render(true);return;}
  if(e.target.closest('#metasEditBtn')){state.metasEdit=!state.metasEdit;render(true);return;}
  if(e.target.closest('#metasNewArea')){OKR2026.areas.push({area:'Nova área',krs:[{kr:'',alvo:'',un:'',tag:'',resp:''}]});render(true);return;}
  const nkrB=e.target.closest('[data-newkr]');if(nkrB){OKR2026.areas[+nkrB.dataset.newkr].krs.push({kr:'',alvo:'',un:'',tag:'',resp:''});render(true);return;}
  const rkrB=e.target.closest('[data-rmkr]');if(rkrB){const pp=rkrB.dataset.rmkr.split(':').map(Number);OKR2026.areas[pp[0]].krs.splice(pp[1],1);render(true);return;}
  const rarB=e.target.closest('[data-rmarea]');if(rarB){OKR2026.areas.splice(+rarB.dataset.rmarea,1);render(true);return;}
  const np=e.target.closest('#newPostBtn');if(np){state.postModal={mode:'new',y:state.year,m:state.month,d:1};render(true);return;}
  const mnav=e.target.closest('[data-mnav]');if(mnav){let mm=state.month+(+mnav.dataset.mnav),yy=state.year;if(mm<0){mm=11;yy--;}if(mm>11){mm=0;yy++;}state.month=mm;state.year=yy;render(true);return;}
  const cvb=e.target.closest('.cc-seg button[data-cv]');if(cvb){state.calCV=cvb.dataset.cv;render(true);return;}
  const pchip=e.target.closest('.post-chip[data-post]');if(pchip){state.postModal={mode:'edit',id:pchip.dataset.post};render(true);return;}
  const pmCloseB=e.target.closest('#pmClose,#pmCancel');if(pmCloseB){state.postModal=null;render(true);return;}
  if(e.target.id==='pmBack'){state.postModal=null;render(true);return;}
  const pmSaveB=e.target.closest('#pmSave');if(pmSaveB){savePost();return;}
  const pmPubB=e.target.closest('#pmPublish');if(pmPubB){const ss=document.getElementById('pmStatus');if(ss)ss.value='publicado';savePost();return;}
  const pmDelB=e.target.closest('#pmDelete');if(pmDelB){if(state.postModal&&state.postModal.id)state.posts=state.posts.filter(x=>x.id!==state.postModal.id);state.postModal=null;render(true);return;}
  const ccCell=e.target.closest('.cc-cell[data-newpost]');if(ccCell){const pp=ccCell.dataset.newpost.split('-').map(Number);state.postModal={mode:'new',y:pp[0],m:pp[1],d:pp[2]};render(true);return;}
  const ctaB=e.target.closest('[data-conta]');if(ctaB){const id=ctaB.dataset.conta;state.contas[id]=!state.contas[id];render(true);return;}
  const pnwB=e.target.closest('[data-pubnow]');if(pnwB){const pp=state.posts.find(x=>x.id===pnwB.dataset.pubnow);if(pp)pp.status='publicado';render(true);return;}
  const mp=e.target.closest('#adsMetricSeg button');if(mp){state.adsMetric=mp.dataset.m;render(true);return;}
  const pl=e.target.closest('#adsPlatSeg button');if(pl){state.adsPlat=pl.dataset.plat;render(true);return;}
  const cv=e.target.closest('#canaisViewSeg button');if(cv){state.canaisView=cv.dataset.cv;render(true);return;}
  const cp=e.target.closest('#concProdSeg button');if(cp){state.concProd=cp.dataset.cp;render(true);return;}
  const ip=e.target.closest('#igProfileSeg button');if(ip){state.igProfile=ip.dataset.ig;render(true);return;}
  const sw=e.target.closest('.switch[data-ind]');if(sw){state.ind[sw.dataset.ind]=!state.ind[sw.dataset.ind];render(true);return;}
  const swR=e.target.closest('.switch[data-rede]');if(swR){const r=swR.dataset.rede;state.redes[r]=!state.redes[r];render();return;}
  const swP=e.target.closest('.switch[data-pind]');if(swP){const pp=swP.dataset.pind.split('|');state.paineis[pp[0]]=Object.assign({},state.paineis[pp[0]],{[pp[1]]:!shownInd(pp[0],pp[1])});render(true);return;}
  const acp=e.target.closest('[data-accpanel]');if(acp){const pn=acp.dataset.accpanel;state.cfgOpen[pn]=!state.cfgOpen[pn];render(true);return;}
  const rm=e.target.closest('.chip-rm button');if(rm){state.perfil[rm.dataset.kind].splice(+rm.dataset.i,1);render();return;}
  const cd=e.target.closest('.cal-day[data-cal]');if(cd){cycleCalStatus(cd);return;}
  const dz=e.target.closest('#drop');if(dz){document.getElementById('fileInput').click();return;}
  const dzf=e.target.closest('#dropFonte');if(dzf){document.getElementById('fonteInput').click();return;}
  const rmft=e.target.closest('[data-rmfonte]');if(rmft){state.fontes=state.fontes.filter(x=>x.id!==rmft.dataset.rmfonte);render(true);return;}
  const fmc=e.target.closest('#fmCancel');if(fmc){state.fonteMap=null;render(true);return;}
  const fma=e.target.closest('#fmAdd');if(fma){addFonte();return;}
  const rf=e.target.closest('#removeFile');if(rf){state.perfil.arquivo=null;render();return;}
});
viewEl.addEventListener('change',e=>{
  if(e.target.classList.contains('cell-edit')){ return commitAdsEdit(e.target); }
  if(e.target.id==='fileInput'){const f=e.target.files&&e.target.files[0];if(f){state.perfil.arquivo=f.name;state.perfil.onboarded=true;render();}return;}
  if(e.target.id==='fonteInput'){const f=e.target.files&&e.target.files[0];if(f)handleFonteFile(f);e.target.value='';return;}
  if(e.target.id==='fEmpresa'){state.perfil.empresa=e.target.value;return;}
  if(e.target.id==='fSegmento'){state.perfil.segmento=e.target.value;return;}
  if(e.target.id==='fCidade'){state.perfil.cidade=e.target.value;return;}
  if(e.target.id==='fSite'){state.perfil.site=e.target.value;return;}
  if(e.target.id==='ccCanal'){state.calCanal=e.target.value;render(true);return;}
  if(e.target.id==='ccPerfil'){state.calPerfil=e.target.value;render(true);return;}
  if(e.target.classList.contains('me-in')){const t=e.target;if(t.dataset.objfld!==undefined){OKR2026.objetivo=t.value;return;}const ai=+t.dataset.ai;if(t.dataset.fld==='area'){if(OKR2026.areas[ai])OKR2026.areas[ai].area=t.value;return;}const ki=+t.dataset.ki;if(OKR2026.areas[ai]&&OKR2026.areas[ai].krs[ki]){OKR2026.areas[ai].krs[ki][t.dataset.fld]=t.value;}return;}
  if(e.target.id==='personaPhotoInput'){if(!state.personaPhotos)state.personaPhotos={};state.personaPhotos[state.personaIdx||0]=e.target.value.trim();render(true);return;}
  if(e.target.id==='ufFeriadoSel'){state.ufFeriado=e.target.value;render(true);return;}
});
viewEl.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.postModal){state.postModal=null;render(true);return;}
  if(e.target.classList.contains('cell-edit')&&e.key==='Enter'){e.preventDefault();e.target.blur();}
  if(e.target.classList.contains('cal-day')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();cycleCalStatus(e.target);}
  if(e.target.classList.contains('chip-input')&&e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v){state.perfil[e.target.dataset.kind].push(v);render();}}
});
viewEl.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over');}});
viewEl.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over');});
viewEl.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f){state.perfil.arquivo=f.name;render();}}});
viewEl.addEventListener('dragover',e=>{const d=e.target.closest('#dropFonte');if(d){e.preventDefault();d.classList.add('over');}});
viewEl.addEventListener('dragleave',e=>{const d=e.target.closest('#dropFonte');if(d)d.classList.remove('over');});
viewEl.addEventListener('drop',e=>{const d=e.target.closest('#dropFonte');if(d){e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleFonteFile(f);}});

/* ==== tooltips interativos nos gráficos (line/bar) ==== */
let __tip=null;
function chartTip(){ if(!__tip){__tip=document.createElement('div');__tip.className='chart-tip';__tip.style.display='none';document.body.appendChild(__tip);} return __tip; }
function hideTip(){ if(__tip)__tip.style.display='none'; document.querySelectorAll('svg.chartI .hoverlay').forEach(g=>g.remove()); }
document.addEventListener('mousemove',ev=>{
  const svg=ev.target.closest?ev.target.closest('svg.chartI'):null;
  if(!svg){ if(__tip&&__tip.style.display!=='none') hideTip(); return; }
  let meta; try{meta=JSON.parse(svg.getAttribute('data-meta').replace(/&#39;/g,"'"));}catch(e){return;}
  const ctm=svg.getScreenCTM(); if(!ctm)return;
  const P=svg.createSVGPoint(); P.x=ev.clientX; P.y=ev.clientY;
  const loc=P.matrixTransform(ctm.inverse());
  const iw=meta.W-meta.pl-meta.pr, ih=meta.H-meta.pt-meta.pb, n=meta.labels.length;
  let idx = meta.type==='bar' ? Math.floor((loc.x-meta.pl)/(iw/n)) : (n<=1?0:Math.round((loc.x-meta.pl)/(iw/(n-1))));
  if(idx<0)idx=0; if(idx>n-1)idx=n-1;
  const xOf=i=> meta.type==='bar' ? (meta.pl+(iw/n)*i+(iw/n)/2) : (n<=1?meta.pl+iw/2:meta.pl+iw*i/(n-1));
  const yOf=v=> meta.pt+ih-((v||0)/meta.max*ih);
  const cx=xOf(idx);
  let g=svg.querySelector('.hoverlay'); if(!g){g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','hoverlay');svg.appendChild(g);}
  let mk=`<line x1="${cx}" y1="${meta.pt}" x2="${cx}" y2="${meta.pt+ih}" stroke="rgba(0,0,0,.22)" stroke-dasharray="3 3"/>`;
  if(meta.type!=='bar'){ meta.series.forEach(s=>{const v=s.values[idx]; if(v==null)return; mk+=`<circle cx="${cx}" cy="${yOf(v)}" r="4.6" fill="#fff" stroke="${s.color}" stroke-width="3"/>`;}); }
  g.innerHTML=mk;
  const fv=v=> (v==null||isNaN(v))?'—':(meta.vfmt==='pct'?Number(v).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':kfmt(v));
  const rows=meta.series.map(s=>`<div class="ctr"><i style="background:${s.color}"></i>${s.name||''}<b>${fv(s.values[idx])}</b></div>`).join('');
  const t=chartTip(); t.innerHTML=`<div class="cth">${meta.labels[idx]}</div>${rows}`; t.style.display='block';
  const tw=t.offsetWidth, th=t.offsetHeight;
  let L=ev.clientX+14, T=ev.clientY-th-12;
  if(L+tw>window.innerWidth-8) L=ev.clientX-tw-14;
  if(T<8) T=ev.clientY+16;
  t.style.left=L+'px'; t.style.top=T+'px';
},true);

render();
</script>

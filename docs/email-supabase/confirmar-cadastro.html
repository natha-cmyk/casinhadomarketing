<!--
  Supabase → Authentication → Emails → Templates → "Confirm signup"
  Cole este HTML no corpo. Mantém {{ .ConfirmationURL }} (o Supabase injeta o link).
  Assunto sugerido: Confirme seu e-mail — Casinha do Marketing
-->
<!doctype html><html><body style="margin:0;background:#EDEDEC;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#121111">
  <div style="max-width:520px;margin:0 auto;padding:24px 16px">
    <div style="background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)">
      <div style="background:#121111;padding:18px 24px;color:#fff;font-weight:800;font-size:16px;letter-spacing:.2px">
        <span style="color:#FF001E">●</span> Casinha do Marketing
      </div>
      <div style="padding:24px">
        <h1 style="font-size:19px;margin:0 0 12px;color:#121111">Confirme seu e-mail</h1>
        <div style="font-size:14.5px;line-height:1.6;color:#333">
          <p>Olá!</p>
          <p>Falta só um passo pra ativar seu acesso à <b>Casinha do Marketing</b>. Confirme seu e-mail no botão abaixo.</p>
        </div>
        <div style="margin:22px 0 6px">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#00BBC5;color:#fff;text-decoration:none;font-weight:700;padding:11px 20px;border-radius:10px;font-size:14px">Confirmar meu e-mail</a>
        </div>
        <p style="font-size:12.5px;color:#8E8E93;margin:14px 0 0">Se você não criou esta conta, pode ignorar este e-mail.</p>
      </div>
    </div>
    <div style="text-align:center;color:#8E8E93;font-size:11.5px;margin-top:14px">
      Casinha do Marketing · Seahub Coworking — Natal/RN
    </div>
  </div></body></html>
